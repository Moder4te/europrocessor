; ================================================================
;  Analog Film Rotary Processor — PlatformIO 프로젝트
;  ESP32-S3 N16R8 (16MB Flash / 8MB PSRAM)
;
;  .ino → C++ OOP 마이그레이션. 소스는 src/ 아래 클래스 단위로 분리.
;  진단용 스케치는 tools/ 에 .ino 그대로 보존 (빌드 대상 아님).
; ================================================================
[env:esp32-s3-devkitc-1]
platform  = espressif32 @ 7.0.1   ; Arduino 코어 포함 — 버전 고정 (검증: 2026-06-12)
board     = esp32-s3-devkitc-1
framework = arduino

; 16MB Flash + Octal PSRAM — 제네릭 보드(N8) 기본값을 N16R8로 강제 오버라이드
board_build.partitions   = partitions.csv
board_build.filesystem   = littlefs
board_upload.flash_size    = 16MB
board_build.flash_size     = 16MB
board_upload.maximum_size  = 16777216
board_build.arduino.memory_type = qio_opi   ; OPI PSRAM (N16R8)
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1   ; 네이티브 USB 포트로 Serial 출력 (S3 모니터 무반응 해결)
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0        ; 0=None (vfs exists() [E]노이즈 억제). 내 Serial 로그는 유지. 디버그시 3
    -DUI_DISPLAY_PRESENT=1        ; 0 = 무디스플레이 변종 (displayTask 미생성). 보드별 화면 유무는 PinMap.h hasDisplay
    -DFW_VARIANT=\"N16R8\"        ; 칩 사양 태그 (웹/로그 표시)

monitor_speed = 115200
upload_speed  = 921600

; 라이브러리 버전 고정 — 2026-06-12 빌드 검증 시점 기준.
; 업그레이드 시 버전만 올리고 pio run 으로 재검증할 것.
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    gin66/FastAccelStepper @ 1.2.5
    adafruit/Adafruit MAX31865 library @ 1.6.2
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library @ 1.11.0
    olikraus/U8g2_for_Adafruit_GFX @ 1.8.0
    bodmer/TJpg_Decoder @ 1.1.0
    https://github.com/mathieucarbou/ESPAsyncWebServer.git#feb92de   ; v3.6.0
    https://github.com/mathieucarbou/AsyncTCP.git#3afa37b            ; v3.3.2

; ================================================================
;  ESP32-S3 N8R2 (8MB Flash / 2MB Quad PSRAM) — 구버전 무디스플레이 바디2 등
;  플래시 용량·PSRAM 종류는 빌드 타임 설정이라 별도 바이너리 필요.
;  ★OTA 시 보드 사양에 맞는 .bin만 업로드★ (펌웨어가 플래시 용량 불일치 이미지를 거부)
;  최초 1회는 USB로 업로드(파티션 표 변경): pio run -e n8r2 -t upload
; ================================================================
[env:n8r2]
extends = env:esp32-s3-devkitc-1
board_build.partitions   = partitions_8MB.csv
board_upload.flash_size    = 8MB
board_build.flash_size     = 8MB
board_upload.maximum_size  = 8388608
board_build.arduino.memory_type = qio_qspi   ; Quad PSRAM (N8R2)
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DUI_DISPLAY_PRESENT=1
    -DFW_VARIANT=\"N8R2\"

