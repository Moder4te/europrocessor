<text x="46" y="606" font-size="12" text-anchor="start" fill="#1f2328" font-weight="normal">⚠ 전원 켠 채 모터 커넥터 탈착 금지 · TMC2209 VIO는 반드시 3.3V (5V면 ESP32 GPIO 손상) · 신호선을 5V 근처로 배선하지 말 것</text>
